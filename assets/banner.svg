<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadows & Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }

      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }

      @keyframes scanMotion {
        0% { transform: translateY(30px); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translateY(350px); opacity: 0; }
      }

      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }

      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }

      .animated-float-1 {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }

      .animated-float-2 {
        animation: floatReverse 8.5s ease-in-out infinite;
        transform-origin: center;
      }

      .animated-scan {
        animation: scanMotion 4.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .animated-pulse {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }

      .circuit-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 25s linear infinite;
      }

      /* Typography */
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }

      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.3px;
      }

      .badge-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="180" cy="110" r="140" fill="#0284c7" opacity="0.18" class="animated-pulse" />
  <circle cx="1020" cy="310" r="180" fill="#6366f1" opacity="0.16" class="animated-pulse" style="animation-delay: 2s;" />

  <!-- Background Tech Grid -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.25">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Flowing Network Circuit Lines (Strictly in Background) -->
  <g fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35" class="circuit-line">
    <path d="M 80 320 L 220 320 L 280 260 L 420 260" />
    <path d="M 820 160 L 940 160 L 1000 220 L 1120 220" />
    <path d="M 780 340 L 890 340 L 930 300 L 1110 300" />
  </g>

  <!-- Animated Scanner Laser (Passing in background) -->
  <g class="animated-scan">
    <rect x="70" y="0" width="1060" height="2" fill="url(#scanBeam)" />
    <rect x="70" y="2" width="1060" height="18" fill="url(#scanBeam)" opacity="0.25" />
  </g>

  <!-- Dynamic Graphic Element 1: Left Floating Document Stack (Kept strictly to the side) -->
  <g class="animated-float-1" transform="translate(65, 85)" filter="url(#softShadow)">
    <!-- Base Document -->
    <rect x="18" y="22" width="115" height="150" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Top Active Document Card -->
    <rect x="0" y="0" width="115" height="150" rx="8" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <!-- Folded Corner Effect -->
    <path d="M 85 0 L 115 30 L 85 30 Z" fill="#38bdf8" opacity="0.4" />
    <!-- Document Text Skeleton Lines -->
    <rect x="14" y="24" width="55" height="6" rx="3" fill="#38bdf8" opacity="0.9" />
    <rect x="14" y="44" width="85" height="4" rx="2" fill="#64748b" />
    <rect x="14" y="56" width="75" height="4" rx="2" fill="#64748b" />
    <rect x="14" y="68" width="80" height="4" rx="2" fill="#64748b" />
    <!-- OCR Scan Simulation -->
    <rect x="14" y="88" width="87" height="36" rx="4" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 2" />
    <text x="20" y="110" font-family="monospace" font-size="10" fill="#38bdf8" font-weight="700">OCR : ACTIVE</text>
  </g>

  <!-- Dynamic Graphic Element 2: Right Floating Cloud Vault & Index Card (Kept strictly to right) -->
  <g class="animated-float-2" transform="translate(1015, 90)" filter="url(#softShadow)">
    <!-- Background Card -->
    <rect x="0" y="0" width="120" height="155" rx="10" fill="url(#cardBg)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.6" />
    <!-- Index Badges -->
    <rect x="15" y="20" width="90" height="18" rx="4" fill="#4f46e5" fill-opacity="0.3" stroke="#818cf8" stroke-width="0.8" />
    <text x="24" y="33" font-family="monospace" font-size="9" fill="#c7d2fe" font-weight="600">METADATA • EDMS</text>
    <!-- Checksum & Status -->
    <circle cx="25" cy="62" r="5" fill="#10b981" />
    <rect x="38" y="59" width="67" height="6" rx="3" fill="#94a3b8" />
    <circle cx="25" cy="85" r="5" fill="#38bdf8" />
    <rect x="38" y="82" width="55" height="6" rx="3" fill="#94a3b8" />
    <circle cx="25" cy="108" r="5" fill="#f59e0b" />
    <rect x="38" y="105" width="62" height="6" rx="3" fill="#94a3b8" />
    <!-- Compliance Lock Icon -->
    <g transform="translate(48, 126)" fill="#818cf8">
      <path d="M 8 0 C 5.8 0 4 1.8 4 4 L 4 6 L 2 6 C 0.9 6 0 6.9 0 8 L 0 16 C 0 17.1 0.9 18 2 18 L 14 18 C 15.1 18 16 17.1 16 16 L 16 8 C 16 6.9 15.1 6 14 6 L 12 6 L 12 4 C 12 1.8 10.2 0 8 0 Z M 8 2 C 9.1 2 10 2.9 10 4 L 10 6 L 6 6 L 6 4 C 6 2.9 6.9 2 8 2 Z" opacity="0.85" />
    </g>
  </g>

  <!-- CENTER FOREGROUND: Guaranteed high visibility with opaque backdrop shield -->
  <g transform="translate(230, 48)">
    <!-- Protective High-Contrast Translucent Backplate -->
    <rect x="0" y="0" width="740" height="318" rx="16" fill="#090d16" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.5" filter="url(#softShadow)" />

    <!-- Top Category Tag -->
    <g transform="translate(40, 36)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#0284c7" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#38bdf8" />
      <text x="26" y="17" fill="#38bdf8" class="badge-label">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <g transform="translate(40, 108)">
      <text class="title-text">
        <tspan fill="url(#primaryGlow)">Awesome DMS</tspan>
        <tspan fill="#ffffff"> &amp; ECM</tspan>
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(40, 150)">
      <text class="subtitle-text">
        <tspan x="0" dy="0">Enterprise Document Management Systems, Intelligent OCR Capture,</tspan>
        <tspan x="0" dy="28">Digital Archiving &amp; Self-Hosted Open-Source Records Platforms</tspan>
      </text>
    </g>

    <!-- Tech Badges / Pills Row -->
    <g transform="translate(40, 235)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="128" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="14" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">⚡ OCR &amp; Search</text>

      <!-- Pill 2 -->
      <rect x="138" y="0" width="134" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="152" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">🔒 Records Mgmt</text>

      <!-- Pill 3 -->
      <rect x="282" y="0" width="140" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
      <text x="296" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">📦 Self-Hosted FOSS</text>

      <!-- Pill 4 -->
      <rect x="432" y="0" width="144" height="30" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5" />
      <text x="446" y="19" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">☁️ Enterprise SaaS</text>
    </g>
  </g>

  <!-- Outer Frame Gradient Glow Border -->
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" opacity="0.4" />
</svg>
